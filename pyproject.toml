[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgi"
version = "0.1.0.dev0"
description = "Hand Gesture Interface: aplicação local de visão computacional."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = [
    "mediapipe==1.0.1",
    "numpy>=2.4,<3",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.6,<1",
    "numpy>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hgi*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["hgi"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
